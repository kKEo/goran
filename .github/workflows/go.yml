name: Go

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Test
        run: go test -timeout 300s ./...

      - name: Build server and agent
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p bin
          go build -trimpath -ldflags="-s -w" -o bin/goran-server ./webapp
          go build -trimpath -ldflags="-s -w" -o bin/goran-agent ./agent
          GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o bin/goran-agent-linux-arm64 ./agent

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: goran-binaries
          path: bin/

  docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Build server image
        run: docker build -f build/Dockerfile.server -t goran-server:ci .
      - name: Build agent image
        run: docker build -f build/Dockerfile.agent -t goran-agent:ci .
